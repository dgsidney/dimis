name: Build Multi-Platform Releases (Windows, Mac, Linux)

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies (Linux only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools desktop-file-utils

      - name: Install Node Dependencies
        run: npm ci

      # Build no Windows (.exe NSIS installer + portable)
      - name: Build Windows Executables
        if: runner.os == 'Windows'
        run: npm run dist:win

      # Build no macOS (.dmg + .zip para Intel e Apple Silicon M1/M2/M3)
      - name: Build macOS Application
        if: runner.os == 'macOS'
        run: npm run dist:mac

      # Build no Linux (.AppImage + .deb)
      - name: Build Linux Packages
        if: runner.os == 'Linux'
        run: npm run dist:linux

      # Salva os executáveis gerados como artefatos no GitHub
      - name: Upload Windows Artifacts
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: dimis-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Upload macOS Artifacts
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: dimis-macos
          path: |
            dist/*.dmg
            dist/*.zip
          if-no-files-found: error

      - name: Upload Linux Artifacts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: dimis-linux
          path: |
            dist/*.AppImage
            dist/*.deb
          if-no-files-found: error

      # Se for uma tag de versão (ex: v1.0.1), anexa tudo na Release automaticamente
      - name: Publish to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
